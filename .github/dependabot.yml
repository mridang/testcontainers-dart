version: 2
updates:
  - package-ecosystem: 'pub'
    directory: '/packages/testcontainers'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10
    groups:
      pub-version-updates:
        patterns:
          - '*'
        applies-to: 'version-updates'
      pub-security-updates:
        patterns:
          - '*'
        applies-to: 'security-updates'

  - package-ecosystem: 'pub'
    directory: '/packages/testcontainers_compose'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10
    groups:
      pub-version-updates:
        patterns:
          - '*'
        applies-to: 'version-updates'
      pub-security-updates:
        patterns:
          - '*'
        applies-to: 'security-updates'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10
    groups:
      actions-version-updates:
        patterns:
          - '*'
        applies-to: 'version-updates'
      actions-security-updates:
        patterns:
          - '*'
        applies-to: 'security-updates'
