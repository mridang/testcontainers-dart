name: DIAG srp token probe

# Throwaway diagnostic: runs ONLY semantic-release-pub's real
# getGoogleIdentityToken() with the GOOGLE_SERVICE_ACCOUNT_KEY secret and
# reports pass/fail. No version bump, no tag, no publish. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16'

      - name: Install semantic-release-pub@0.12.0
        run: |
          npm init -y >/dev/null
          npm install semantic-release-pub@0.12.0 >/dev/null
          echo "node: $(node --version)"
          node -e "console.log('srp:', require('semantic-release-pub/package.json').version)"

      - name: Probe srp getGoogleIdentityToken with the real secret
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cat > probe.mjs <<'JS'
          // Calls semantic-release-pub's OWN code path (the same function
          // verifyConditions/publish call). Prints no secret material.
          import { getGoogleIdentityToken } from 'semantic-release-pub/dist/utils.js';
          const key = process.env.GOOGLE_SERVICE_ACCOUNT_KEY;
          if (!key) { console.log('RESULT: NO SECRET PRESENT'); process.exit(2); }
          try {
            const token = await getGoogleIdentityToken(key);
            console.log('RESULT: SUCCESS — srp returned a token');
            console.log('  token length:', token.length);
            console.log('  looks like a JWT (3 parts):', token.split('.').length === 3);
          } catch (e) {
            console.log('RESULT: FAILED — ' + e.message);
            process.exit(1);
          }
          JS
          node probe.mjs
