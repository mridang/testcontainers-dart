name: Release to pub.dev

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: ./

jobs:
  publish-package:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: |
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
          "$PUB_CACHE/bin/melos" bootstrap

      - name: Run semantic-release
        id: release
        uses: mridang/action-semantic-release@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish testcontainers_core
        if: steps.release.outputs.new-release-published == 'true'
        working-directory: packages/testcontainers_core
        run: dart pub publish --force

      - name: Publish testcontainers_compose
        if: steps.release.outputs.new-release-published == 'true'
        working-directory: packages/testcontainers_compose
        run: dart pub publish --force
